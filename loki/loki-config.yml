auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

storage_config:
  filesystem:
    directory: /loki/chunks

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

  rule_path: /loki/rules-temp

  alertmanager_url: http://medflow-alertmanager:9093

  enable_api: true
