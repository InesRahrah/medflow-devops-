server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker

    static_configs:

      - targets:
          - localhost

        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:

      - json:
          expressions:
            stream: stream
            log: log

      - docker: {}

    relabel_configs:

      # Nom du fichier
      - source_labels: ['__path__']
        target_label: filename

      # ID du conteneur
      - source_labels: ['__path__']
        regex: '.*/([a-f0-9]{64})/.*'
        target_label: container_id
