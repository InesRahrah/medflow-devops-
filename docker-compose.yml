services:

  mysql:
    image: mysql:8.0
    container_name: medflow-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medflow
      MYSQL_USER: medflow
      MYSQL_PASSWORD: medflow123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - medflow-network


  user-service:
    image: medflow-user-service:latest
    container_name: medflow-user-service

    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medflow_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: medflow
      SPRING_DATASOURCE_PASSWORD: medflow123

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - medflow-network


  stock-service:
    image: medflow-stock-service:latest
    container_name: medflow-stock-service

    restart: unless-stopped

    ports:
      - "8086:8086"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medflow_stock?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: medflow
      SPRING_DATASOURCE_PASSWORD: medflow123

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - medflow-network


  frontend:
    image: medflow-frontend:latest
    container_name: medflow-frontend

    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      - user-service
      - stock-service

    networks:
      - medflow-network


  prometheus:
    image: prom/prometheus:latest
    container_name: medflow-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - user-service
      - stock-service

    networks:
      - medflow-network


  alertmanager:
    image: prom/alertmanager:latest
    container_name: medflow-alertmanager

    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    depends_on:
      - prometheus

    networks:
      - medflow-network


  grafana:
    image: grafana/grafana:latest
    container_name: medflow-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki

    networks:
      - medflow-network


  loki:
    image: grafana/loki:3.0.0
    container_name: medflow-loki

    restart: unless-stopped

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki

    depends_on:
      - user-service
      - stock-service

    networks:
      - medflow-network


  promtail:
    image: grafana/promtail:3.0.0
    container_name: medflow-promtail

    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/promtail-config.yml"

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - loki

    networks:
      - medflow-network


volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:


networks:
  medflow-network:
    driver: bridge
